<div class="shell">
  <app-demo-header />

  <!--
    This app's own two screens. Kept as a sub-nav under the shared suite
    header rather than pushed into it: the header is identical across all
    four apps by design, and adding a per-app slot to it is how "identical"
    quietly stops being true.
  -->
  @if (auth.isAuthenticated()) {
    <nav class="app-nav" aria-label="Sections">
      <div class="app-nav-inner">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Playground</a>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      </div>
    </nav>
  }

  <main class="content" [class.content-authed]="auth.isAuthenticated()">
    <router-outlet />
  </main>

  <app-demo-footer />
</div>
